<!DOCTYPE html>
<html>

  <head>
        <title>Map Coloring w/ Backtracking</title>
        <!--These load several d3 libraries you might need-->
		<script src="d3/d3.v4.min.js"></script>
    <script src="StateNeighbors.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body {
              margin: 0;
              height: 100%;
              background-color: #2b2b2b;
              font-family: sans-serif;
              overflow: hidden;
              }
      #toolbar {
              min-height: 44px;
              }
      #viz {
              height: calc(100vh - 44px);
              display: flex;
              justify-content: center;
              align-items: center;
              }
      #viz svg {
              width: 100%;
              height: 100%;
              }
      #toolbar {
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 0;
              padding: 0;
              background: #1e1e1e;
              border-bottom: 1px solid #444;
              }
      .tb-section {
              display: flex;
              align-items: center;
              gap: 10px;
              padding: 0 16px;
              height: 44px;
              border-right: 1px solid #555;
              }
      .tb-section:last-child {
              border-right: none;
              }
      #toolbar button {
              padding: 6px 18px;
              background: #444;
              color: #eee;
              border: 1px solid #666;
              border-radius: 4px;
              cursor: pointer;
              font-size: 14px;
              }
      #toolbar button:hover {
              background: #555;
              }
      #toolbar label {
              color: #ccc;
              font-size: 13px;
              }
      #speedSlider {
              width: 120px;
              accent-color: #1a6fcc;
              }
      #speedDisplay {
              color: #aaa;
              font-size: 13px;
              min-width: 50px;
              }
      svg text{
              -webkit-user-select: none;
              -moz-user-select: none;
              -ms-user-select: none;
              user-select: none;
              }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="tb-section">
        <span style="color:white; font-size:20px; font-weight:400;">Map Coloring w/ Backtracking</span>
      </div>
      <div class="tb-section">
        <button id="playPauseBtn">Pause</button>
        <button id="stepBtn">Step</button>
        <button id="resetBtn">Reset</button>
        <label for="speedSlider" style="margin-left:16px;">Speed:</label>
        <input id="speedSlider" type="range" min="1" max="120" value="30">
        <span id="speedDisplay">30 fps</span>
      </div>
      <div class="tb-section">
        <span style="color:#aaa; font-size:13px;">Variable Order:</span>
        <label title="None — states assigned in default order" style="display:flex; align-items:center; gap:4px; cursor:pointer; color:#ccc; font-size:13px;">
          <input type="radio" name="varOrder" value="none" checked> None
        </label>
        <label title="Degree heuristic — pick states in order of most neighbors to fewest" style="display:flex; align-items:center; gap:4px; cursor:pointer; color:#ccc; font-size:13px;">
          <input type="radio" name="varOrder" value="degree"> Deg
        </label>
        <label title="Minimum Remaining Values — pick state with fewest legal colors next" style="display:flex; align-items:center; gap:4px; cursor:pointer; color:#ccc; font-size:13px;">
          <input type="radio" name="varOrder" value="mrv"> MRV
        </label>
      </div>
      <div class="tb-section">
        <span style="color:#aaa; font-size:13px;">Inference:</span>
        <label title="None - no inference about unassigned neighbors" style="display:flex; align-items:center; gap:4px; cursor:pointer; color:#ccc; font-size:13px;">
          <input type="radio" name="filtering" value="none" checked> None
        </label>
        <label title="Forward Checking — prune assigned color from unassigned neighbors immediately" style="display:flex; align-items:center; gap:4px; cursor:pointer; color:#ccc; font-size:13px;">
          <input type="radio" name="filtering" value="fc"> FC
        </label>
        <label title="Maintaining Arc Consistency — run localized AC-3 after each assignment" style="display:flex; align-items:center; gap:4px; cursor:pointer; color:#ccc; font-size:13px;">
          <input type="radio" name="filtering" value="ac3"> MAC
      </div>
    </div>
    <div id="viz">
    <script type="text/javascript" src="myViz.js"></script>
    </div>
  </body>
</html>
